name: CI

on:
  push:
    branches: main
  pull_request:
  workflow_call:  # allow this workflow to be called from other workflows

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.version.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:21
          apps: scala-cli
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install Deder
        run: brew install sake92/tap/deder
      - name: Check publishing versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          versions=$(deder exec -t version)
          echo "$versions"
          version=$(sed -nE 's/^[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?)$/\1/p' <<< "$versions" | sort -u)
          if [[ -z "$version" || "$version" == *$'\n'* ]]; then
            echo "Expected one publishing version across all modules"
            exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi
      - run: deder exec -t test

  publish-snapshots:
    name: publish snapshots
    needs: test
    if: github.repository == 'sake92/openapi4s' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install Deder
        run: brew install sake92/tap/deder
      - name: Publish snapshots
        env:
          DEDER_PUBLISH_SNAPSHOT: "true"
          DEDER_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          DEDER_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: deder exec -t publish
