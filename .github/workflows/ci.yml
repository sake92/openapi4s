name: CI

on:
  push:
    branches: main
  pull_request:
  workflow_call:  # allow this workflow to be called from other workflows

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.version.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: scala-cli
      - name: Check publishing versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ./mill show __.publishVersion > versions.json
          python3 - <<'PY'
          import json
          import os

          with open("versions.json") as source:
              versions = set(json.load(source).values())
          if len(versions) != 1:
              raise SystemExit("Expected one publishing version across all modules")
          version = versions.pop()
          print(f"Publishing version: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"snapshot={str(version.endswith('-SNAPSHOT')).lower()}\n")
          PY
      - run: ./mill __.test

  publish-snapshots:
    name: publish snapshots
    needs: test
    if: github.repository == 'sake92/openapi4s' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish snapshots
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./mill -i __.publishSonatypeCentral
