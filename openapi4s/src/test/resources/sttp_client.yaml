openapi: 3.0.0
info:
  title: Sttp Client Test API
  version: 1.0.0
servers:
  - url: http://petstore.swagger.io/v1
  - url: http://petstore.swagger.io/v2
paths:
  /pet/{petId}:
    get:
      tags: [pet]
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: api_key
          in: header
          required: true
          schema: { type: string }
        - name: trace
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "404":
          description: not found
  /pet/findByStatus:
    get:
      tags: [pet]
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [available, pending, sold] }
        - name: limit
          in: query
          required: true
          schema: { type: integer, format: int32 }
        - name: badObj
          in: query
          schema:
            type: object
            properties:
              x: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
  /pet:
    post:
      tags: [pet]
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pet" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
  /store/order:
    post:
      tags: [store]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Order" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /health:
    get:
      operationId: healthCheck
      responses:
        "204":
          description: no content
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Order:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
