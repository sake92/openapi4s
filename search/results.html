<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="">
  <title>Search | OpenAPI4s Documentation</title>
  <link rel="icon" href="https://sake92.github.io/openapi4s/images/favicon.svg" type="image/svg+xml">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/a11y-dark.min.css" media="(prefers-color-scheme: dark)" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/a11y-light.min.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://sake92.github.io/openapi4s/styles/default.css">
 </head>
 <body>
  <header class="pico container">
   <nav aria-label="Main navigation">
    <a href="https://sake92.github.io/openapi4s/">OpenAPI4s Documentation</a>
    <div>
     <a href="https://sake92.github.io/openapi4s/tutorials">Tutorials</a> <a href="https://sake92.github.io/openapi4s/howtos">How-Tos</a> <a href="https://sake92.github.io/openapi4s/reference">Reference</a> <a href="https://sake92.github.io/openapi4s/explanation">Explanation</a>
    </div>
    <form action="https://sake92.github.io/openapi4s/search/results.html" method="get" role="search">
     <input name="q" type="search" placeholder="Search" aria-label="Search this site">
    </form>
   </nav>
  </header>
  <script>
for (const link of document.querySelectorAll('body > header > nav > div > a')) {
    const path = new URL(link.href).pathname.replace(/\/$/, '');
    const current = window.location.pathname;
    if (current === path || current.startsWith(path + '/')) link.setAttribute('aria-current', 'page');
}
</script>
  <main class="pico container">
   <div>
    <div class="content">
     <h1>Search</h1>
     <p id="search-status" role="status" aria-live="polite">Loading search results…</p>
     <div id="search-results"></div>
    </div>
   </div>
  </main>
  <footer class="pico container site-footer">
   <span><strong>OpenAPI4s</strong> — contract-first Scala 3 code generation</span> <a href="https://github.com/sake92/openapi4s">GitHub</a>
  </footer>
  <script>
(async () => {
    const query = new URLSearchParams(window.location.search).get('q')?.trim() || '';
    const status = document.getElementById('search-status');
    const results = document.getElementById('search-results');
    const input = document.querySelector('form[role="search"] input[name="q"]');
    if (input) input.value = query;
    if (!query) {
        status.textContent = 'Enter a search term above.';
        return;
    }

    const terms = query.toLocaleLowerCase().split(/\s+/).filter(Boolean);
    try {
        const response = await fetch('https://sake92.github.io/openapi4s/search/entries.json');
        if (!response.ok) throw new Error('Search index unavailable');
        const entries = await response.json();
        const matches = entries.map(entry => {
            const title = String(entry.title || 'Untitled');
            const text = String(entry.text || '');
            const titleLower = title.toLocaleLowerCase();
            const textLower = text.toLocaleLowerCase();
            if (!terms.every(term => titleLower.includes(term) || textLower.includes(term))) return null;
            return { entry, title, text, score: terms.reduce((score, term) =>
                score + (titleLower.includes(term) ? 3 : 0) + (textLower.includes(term) ? 1 : 0), 0) };
        }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 50);

        status.textContent = matches.length ? `${matches.length} result${matches.length === 1 ? '' : 's'} for “${query}”` : `No results for “${query}”.`;
        for (const match of matches) {
            const article = document.createElement('article');
            const heading = document.createElement('h2');
            const link = document.createElement('a');
            link.href = match.entry.url;
            highlight(link, match.title, terms);
            heading.append(link);
            const excerpt = document.createElement('p');
            const lower = match.text.toLocaleLowerCase();
            const positions = terms.map(term => lower.indexOf(term)).filter(index => index >= 0);
            const start = Math.max(0, (positions.length ? Math.min(...positions) : 0) - 65);
            const snippet = match.text.slice(start, start + 210).trim();
            if (start > 0) excerpt.append('…');
            highlight(excerpt, snippet, terms);
            if (start + 210 < match.text.length) excerpt.append('…');
            article.append(heading, excerpt);
            results.append(article);
        }
    } catch (error) {
        status.textContent = 'Search is unavailable right now. Please try again later.';
    }

    function highlight(container, value, words) {
        const pattern = new RegExp(words.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
        let position = 0;
        for (const match of value.matchAll(pattern)) {
            container.append(document.createTextNode(value.slice(position, match.index)));
            const mark = document.createElement('mark');
            mark.textContent = match[0];
            container.append(mark);
            position = match.index + match[0].length;
        }
        container.append(document.createTextNode(value.slice(position)));
    }
})();
</script>
  <script>
if (window.matchMedia('(max-width: 850px)').matches) {
    document.querySelectorAll('body > main > div > aside > details').forEach(details => { details.open = false; });
}
</script>
  <script src="https://sake92.github.io/openapi4s/scripts/code-copy.js"></script>
 </body>
</html>
